name: Build and deploy ebook

on:
  push:
    # main 외에 작업 브랜치에서도 배포해, 합치기 전에 실제 사이트를 확인할 수 있게 합니다.
    branches:
      - main
      - 'claude/**'
  # 매월 1일 09:00 KST — 국토부 실거래 갱신 후 재배포
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  # 수집한 실거래를 저장소에 되커밋하기 위해 write 가 필요합니다.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 데이터 정합성 점검
        run: node scripts/check-data.mjs

      - name: 실거래가 수집
        # 시크릿이 없으면 저장소에 커밋된 데이터로 그대로 빌드합니다.
        # 동시 6건으로 받으므로 정상이면 3~5분입니다. 상한을 두되,
        # 수집이 실패해도 배포는 계속되도록 continue-on-error 를 둡니다.
        timeout-minutes: 12
        continue-on-error: true
        id: fetch
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          if [ -z "$MOLIT_API_KEY" ]; then
            echo "MOLIT_API_KEY 미설정 — 커밋된 data/trades/ 로 빌드합니다."
            echo "fetched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if node scripts/fetch-trades.mjs --months 36 --concurrency 6; then
            echo "fetched=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::실거래 수집 실패 — 기존 데이터로 빌드를 계속합니다."
            echo "fetched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 수집한 실거래 되커밋
        # push 에서도 커밋합니다. 되커밋 메시지에 [skip ci] 가 붙어 GitHub 이
        # 그 커밋으로는 워크플로를 다시 실행하지 않으므로 반복되지 않습니다.
        # (workflow_dispatch 는 이 워크플로가 main 에 없어 쓸 수 없습니다.)
        if: steps.fetch.outputs.fetched == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git diff 는 추적하지 않는 새 파일을 보지 못합니다. 먼저 add 한 뒤
          # 스테이지와 비교해야 '처음 만들어진 파일'도 잡힙니다.
          git add -A data/trades/
          if git diff --cached --quiet -- data/trades/; then
            echo "실거래 데이터 변동 없음 — 커밋하지 않습니다."
            exit 0
          fi
          COUNT=$(node -e "const t=require('./data/trades/apgujeong.json');console.log(t.totals.trades)")
          RANGE=$(node -e "const t=require('./data/trades/apgujeong.json');console.log(t.range.from+'~'+t.range.to)")
          git commit -m "실거래가 갱신: 압구정동 ${COUNT}건 (${RANGE}) [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: OSM 지형 수집
        # 강·도로·건물 윤곽은 거의 바뀌지 않으므로 파일이 없을 때만 받습니다.
        # 다시 받고 싶으면 커밋 메시지에 [osm] 을 넣어 주세요.
        timeout-minutes: 20
        continue-on-error: true
        id: osm
        run: |
          MSG=$(git log -1 --pretty=%B || true)
          if [ -f data/osm/apgujeong.geojson ] && ! printf '%s' "$MSG" | grep -q '\[osm\]'; then
            echo "data/osm/apgujeong.geojson 있음 — 건너뜁니다."
            echo "fetched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if node scripts/fetch-osm.mjs; then
            echo "fetched=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::OSM 수집 실패 — 개념도로 빌드를 계속합니다."
            echo "fetched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 수집한 OSM 지형 되커밋
        if: steps.osm.outputs.fetched == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 위와 같은 이유로 add 를 먼저 합니다.
          git add -A data/osm/
          if git diff --cached --quiet -- data/osm/; then
            echo "지형 데이터 변동 없음 — 커밋하지 않습니다."
            exit 0
          fi
          # require() 는 확장자로 형식을 정합니다. .geojson 은 JSON 으로 보지 않고
          # 자바스크립트로 읽으려다 실패하므로 직접 읽어서 파싱합니다.
          COUNT=$(node -e "const fs=require('node:fs');console.log(JSON.parse(fs.readFileSync('./data/osm/apgujeong.geojson','utf8')).features.length)")
          git commit -m "OSM 지형 갱신: 피처 ${COUNT}개 [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 샘플 데이터 준비
        # 실거래 파일이 전혀 없을 때만 레이아웃 확인용 샘플을 만듭니다.
        run: |
          if [ ! -f data/trades/apgujeong.json ] && [ ! -f data/trades/sample.json ]; then
            node scripts/make-sample.mjs
          fi

      - name: 빌드
        run: node scripts/build.mjs

      - name: 내부 링크 점검
        run: node scripts/check-links.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
